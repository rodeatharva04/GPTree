<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GPTree</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #191919;
            --bg-card: #202123;
            --accent: #20b8cd;
            --text-main: #ECECFA;
            --text-muted: #8e8ea0;
            --border: #333;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .logo {
            font-size: 2em;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            background: #2A2B32;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .error {
            color: #ff4a4a;
            font-size: 0.85em;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo"><i class="fa fa-sitemap"></i> GPTree</div>

        <div id="login-section">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button class="btn" onclick="login()">Login</button>
            <div class="footer">
                <a href="#" onclick="showSection('forgot-section')">Forgot Password?</a>
            </div>
        </div>

        <div id="forgot-section" style="display:none;">
            <p style="text-align:center; font-size: 0.9em; color: var(--text-muted); margin-bottom: 20px;">
                Enter your email address to receive a password reset OTP.
            </p>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="forgot-email" placeholder="email@example.com">
            </div>
            <button class="btn" onclick="forgotPassword()">Send OTP</button>
            <div class="footer">
                <a href="#" onclick="showSection('login-section')">Back to Login</a>
            </div>
        </div>

        <div id="reset-section" style="display:none;">
            <p style="text-align:center; font-size: 0.9em; color: var(--text-muted); margin-bottom: 20px;">
                Enter the OTP sent to your email and your new password.
            </p>
            <div class="form-group">
                <label>OTP</label>
                <input type="text" id="reset-otp" placeholder="123456" maxlength="6">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="new-password" placeholder="Min. 8 characters">
            </div>
            <button class="btn" onclick="resetPassword()">Reset Password</button>
        </div>

        <div id="otp-section" style="display:none;">
            <p style="text-align:center; font-size: 0.9em; color: var(--text-muted); margin-bottom: 20px;">
                Your account is not verified. Please enter the OTP sent to your email.
            </p>
            <div class="form-group">
                <label>Enter OTP</label>
                <input type="text" id="otp" placeholder="123456" maxlength="6">
            </div>
            <button class="btn" onclick="verifyOtp()">Verify & Sign In</button>
        </div>

        <div id="error-msg" class="error"></div>
        <div class="footer" id="main-footer">
            Don't have an account? <a href="/register/">Register</a>
        </div>
    </div>

    <script>
        let currentUserId = null;

        function showSection(id) {
            ['login-section', 'forgot-section', 'reset-section', 'otp-section'].forEach(s => {
                const el = document.getElementById(s);
                if (el) el.style.display = s === id ? 'block' : 'none';
            });
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('main-footer').style.display = (id === 'login-section' || id === 'otp-section') ? 'block' : 'none';
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');

            try {
                const res = await fetch('/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/';
                } else if (res.status === 403) {
                    currentUserId = data.user_id;
                    showSection('otp-section');
                } else {
                    errorEl.innerText = data.error;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.innerText = 'Something went wrong.';
                errorEl.style.display = 'block';
            }
        }

        async function forgotPassword() {
            const email = document.getElementById('forgot-email').value;
            const errorEl = document.getElementById('error-msg');
            try {
                const res = await fetch('/api/forgot_password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    currentUserId = data.user_id;
                    showSection('reset-section');
                } else {
                    errorEl.innerText = data.error;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.innerText = 'Email not found or error occurred.';
                errorEl.style.display = 'block';
            }
        }

        async function resetPassword() {
            const otp = document.getElementById('reset-otp').value;
            const password = document.getElementById('new-password').value;
            const errorEl = document.getElementById('error-msg');
            try {
                const res = await fetch('/api/reset_password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, otp, password })
                });
                if (res.ok) {
                    alert('Password reset successful! Please login.');
                    showSection('login-section');
                } else {
                    const data = await res.json();
                    errorEl.innerText = data.error;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.innerText = 'Failed to reset password.';
                errorEl.style.display = 'block';
            }
        }

        async function verifyOtp() {
            const otp = document.getElementById('otp').value;
            const errorEl = document.getElementById('error-msg');
            try {
                const res = await fetch('/api/verify_otp/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, otp: otp })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorEl.innerText = data.error;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.innerText = 'Failed to verify OTP.';
                errorEl.style.display = 'block';
            }
        }
    </script>
</body>

</html>
