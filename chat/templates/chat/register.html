<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GPTree</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #191919;
            --bg-card: #202123;
            --accent: #20b8cd;
            --text-main: #ECECFA;
            --text-muted: #8e8ea0;
            --border: #333;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .logo {
            font-size: 2em;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            background: #2A2B32;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .error {
            color: #ff4a4a;
            font-size: 0.85em;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        #otp-section {
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo"><i class="fa fa-sitemap"></i> GPTree</div>

        <div id="register-section">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password">
            </div>
            <button class="btn" onclick="register()">Register</button>
        </div>

        <div id="otp-section">
            <p style="text-align:center; font-size: 0.9em; color: var(--text-muted); margin-bottom: 20px;">
                We've sent a 6-digit OTP to your email. Please enter it below.
            </p>
            <div class="form-group">
                <label>Enter OTP</label>
                <input type="text" id="otp" placeholder="123456" maxlength="6"
                    style="text-align:center; font-size: 1.5em; letter-spacing: 5px;">
            </div>
            <button class="btn" onclick="verifyOtp()">Verify & Sign In</button>
        </div>

        <div id="error-msg" class="error"></div>

        <div class="footer">
            Already have an account? <a href="/login/">Login</a>
        </div>
    </div>

    <script>
        let currentUserId = null;

        async function register() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');

            try {
                const res = await fetch('/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    currentUserId = data.user_id;
                    document.getElementById('register-section').style.display = 'none';
                    document.getElementById('otp-section').style.display = 'block';
                    errorEl.style.display = 'none';
                } else {
                    errorEl.innerText = data.error;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.innerText = 'Something went wrong.';
                errorEl.style.display = 'block';
            }
        }

        async function verifyOtp() {
            const otp = document.getElementById('otp').value;
            const errorEl = document.getElementById('error-msg');

            try {
                const res = await fetch('/api/verify_otp/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, otp: otp })
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errorEl.innerText = data.error;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.innerText = 'Something went wrong.';
                errorEl.style.display = 'block';
            }
        }
    </script>
</body>

</html>
